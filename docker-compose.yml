# WaspBot: three trading wasps on one small VPS. Paper trading unless you deliberately change it.
#
#   docker compose up -d        then open http://<your-server-ip>/ and follow Setup
#   docker compose logs engine  shows the one-time SETUP CODE and what the engine is doing
#                               (Setup is open for 2 hours after it starts)
#
# The images are built from this repo by GitHub Actions. To build them yourself instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Settings: most people need none (Setup asks for your keys). Anything below can be set in a .env file next to this
# one, or in Hostinger Docker Manager's environment variables. See .env.example for the full list.
name: waspbot

services:
  engine:
    image: ghcr.io/augisko/waspbot-engine:latest
    restart: always
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Every setting in .env.example reaches the engine through this file, if you create it. Optional.
    env_file:
      - path: .env
        required: false
    environment:
      # Paper trading by default. Real money needs DRY_RUN=false, MODE=live, per-wasp OKX keys and LIVE_ACK (see README).
      DRY_RUN: ${DRY_RUN:-true}
      MODE: ${MODE:-dry}
      LIVE_ACK: ${LIVE_ACK:-}
      # The decision engine: "rules" (code only, free) or "llm" (a model picks, the rules are its fallback).
      # Switchable later from the dashboard. Keys are optional here: Setup asks for them.
      DECISION_ENGINE: ${DECISION_ENGINE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # News and knowledge (docs/KNOWLEDGE.md). RSS needs nothing; CryptoPanic needs a free token; web search uses the
      # model key and the knowledge budget.
      NEWS_RSS: ${NEWS_RSS:-true}
      CRYPTOPANIC_TOKEN: ${CRYPTOPANIC_TOKEN:-}
      NEWS_WEB_SEARCH: ${NEWS_WEB_SEARCH:-false}
      KNOWLEDGE_DAILY_USD_CAP: ${KNOWLEDGE_DAILY_USD_CAP:-1}
      EVENTS_ICS_URL: ${EVENTS_ICS_URL:-}
      # Portfolio rules across all three wasps.
      PORTFOLIO_MAX_DRAWDOWN_PCT: ${PORTFOLIO_MAX_DRAWDOWN_PCT:-20}
      PORTFOLIO_DAILY_LOSS_PCT: ${PORTFOLIO_DAILY_LOSS_PCT:-6}
      NET_EXPOSURE_MAX_X: ${NET_EXPOSURE_MAX_X:-1}
      REGIME_FILTER: ${REGIME_FILTER:-true}
      # How often each wasp is looked at (stops, caps), and the daily caps on decision spend in USD (Jev's is soft).
      # A model is asked at most once a minute per wasp whatever TICK_MS is (*_MIN_INTERVAL_MS).
      TICK_MS: ${TICK_MS:-10000}
      GEMINI_DAILY_USD_CAP: ${GEMINI_DAILY_USD_CAP:-3}
      JEV_DAILY_USD_CAP: ${JEV_DAILY_USD_CAP:-2}
      BEE_START_EQUITY_USD: ${BEE_START_EQUITY_USD:-333}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Setup stays open this many minutes after the engine starts; after that, restart the engine to open it again.
      SETUP_WINDOW_MIN: ${SETUP_WINDOW_MIN:-120}
      # Blank = a fresh random setup code in the log at every start. Set it only if you cannot read the logs.
      SETUP_CODE: ${SETUP_CODE:-}
      # Only if your Setup file has no owner password (older installs, or keys set only here): gates the dashboard's
      # controls (engine, news, knowledge, resume after the portfolio breaker). At least 8 characters.
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      # "Update available" on the dashboard when a newer release is out (checks GitHub; never installs anything).
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # A Hive (public paper-trading leaderboard). Blank = none; WaspBot ships without one.
      HIVE_URL: ${HIVE_URL:-}
      # The Beekeeper (optional, docs/BEEKEEPER.md). Normally connected from the dashboard; anything set here wins.
      BEEKEEPER_WEBHOOK_URL: ${BEEKEEPER_WEBHOOK_URL:-}
      BEEKEEPER_EVERY_HOURS: ${BEEKEEPER_EVERY_HOURS:-}
      BEEKEEPER_RAMP_START: ${BEEKEEPER_RAMP_START:-}
      # Where the Beekeeper's Zap finds this server. Blank = https://<PUBLIC_DOMAIN>, or the address you connected from.
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      LAB_SECRET: ${LAB_SECRET:-}
      # Per-wasp OKX keys, for demo or live only (the variable names keep BEE1, BEE2, BEE3).
      BEE1_OKX_DEMO_API_KEY: ${BEE1_OKX_DEMO_API_KEY:-}
      BEE1_OKX_DEMO_API_SECRET: ${BEE1_OKX_DEMO_API_SECRET:-}
      BEE1_OKX_DEMO_API_PASSPHRASE: ${BEE1_OKX_DEMO_API_PASSPHRASE:-}
      BEE2_OKX_DEMO_API_KEY: ${BEE2_OKX_DEMO_API_KEY:-}
      BEE2_OKX_DEMO_API_SECRET: ${BEE2_OKX_DEMO_API_SECRET:-}
      BEE2_OKX_DEMO_API_PASSPHRASE: ${BEE2_OKX_DEMO_API_PASSPHRASE:-}
      BEE3_OKX_DEMO_API_KEY: ${BEE3_OKX_DEMO_API_KEY:-}
      BEE3_OKX_DEMO_API_SECRET: ${BEE3_OKX_DEMO_API_SECRET:-}
      BEE3_OKX_DEMO_API_PASSPHRASE: ${BEE3_OKX_DEMO_API_PASSPHRASE:-}
      BEE1_OKX_API_KEY: ${BEE1_OKX_API_KEY:-}
      BEE1_OKX_API_SECRET: ${BEE1_OKX_API_SECRET:-}
      BEE1_OKX_API_PASSPHRASE: ${BEE1_OKX_API_PASSPHRASE:-}
      BEE2_OKX_API_KEY: ${BEE2_OKX_API_KEY:-}
      BEE2_OKX_API_SECRET: ${BEE2_OKX_API_SECRET:-}
      BEE2_OKX_API_PASSPHRASE: ${BEE2_OKX_API_PASSPHRASE:-}
      BEE3_OKX_API_KEY: ${BEE3_OKX_API_KEY:-}
      BEE3_OKX_API_SECRET: ${BEE3_OKX_API_SECRET:-}
      BEE3_OKX_API_PASSPHRASE: ${BEE3_OKX_API_PASSPHRASE:-}
      # Inside the compose network only; the port is never published. Caddy is the only way in.
      ENGINE_BIND: 0.0.0.0
      ENGINE_PORT: "8080"
      DB_PATH: /data/bees-{mode}.sqlite
      SETTINGS_PATH: /data/settings.json
    volumes:
      - bees-data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ghcr.io/augisko/waspbot-web:latest
    restart: always
    depends_on: [engine]
    # Non-root Caddy with every capability dropped; the namespaced sysctl lets it bind 80/443.
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Blank = plain HTTP on the server's IP. Set a domain that points at this server to get automatic HTTPS.
      SITE_ADDRESS: ${PUBLIC_DOMAIN:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Nightly consistent SQLite backup into the same volume (/data/backups); keeps 7 days.
  backup:
    image: ghcr.io/augisko/waspbot-backup:latest
    restart: always
    depends_on: [engine]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - bees-data:/data

volumes:
  bees-data:
  caddy-data:
  caddy-config:
